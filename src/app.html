<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />

		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/logo.png" />
		<meta name="theme-color" content="#2aabee" />

		<!-- Tipografi: Inter — modern, yaygin, net UI fontu. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>

		<!-- Tema: ilk boyamadan once .dark sinifini ayarla (FOUC yok). -->
		<!-- Oncelik: kullanici localStorage tercihi > cihaz prefers-color-scheme. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme'); // 'dark' | 'light' | null
					var systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = t === 'dark' || (t !== 'light' && systemDark);
					if (dark) document.documentElement.classList.add('dark');

					// Kullanici elle bir tercih kaydetmediyse (t === null) cihaz temasini takip et.
					if (t === null && window.matchMedia) {
						var mq = matchMedia('(prefers-color-scheme: dark)');
						var handler = function (e) {
							if (localStorage.getItem('theme') === null) {
								document.documentElement.classList.toggle('dark', e.matches);
							}
						};
						if (mq.addEventListener) mq.addEventListener('change', handler);
						else if (mq.addListener) mq.addListener(handler);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
